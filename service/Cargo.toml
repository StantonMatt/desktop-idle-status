[package]
name = "desktop-idle-status"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
async-trait = "0.1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "process", "net"] }
futures-util = "0.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
rusqlite = { version = "0.38", features = ["bundled"] }
notify = "8"

[dev-dependencies]
tempfile = "3"
